name: Publicar post automático no Instagram

on:
  schedule:
    # Roda a cada 15 minutos, mas "deslocado" 3 minutos dos horários
    # redondos (:00, :15, :30, :45) de propósito — o próprio GitHub
    # avisa oficialmente que esses horários "redondos" são os de maior
    # congestionamento da plataforma, quando execuções agendadas podem
    # atrasar bastante ou até serem puladas inteiras. Rodando em
    # :03, :18, :33, :48, a chance de atraso/perda cai bastante.
    - cron: "3,18,33,48 * * * *"
  workflow_dispatch: {}  # permite rodar manualmente pelo GitHub também

permissions:
  contents: write  # necessário para o robô poder commitar as imagens comprimidas

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Rodar o robô de publicação
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          DRIVE_BIBLIOTECA_FOLDER_ID: ${{ secrets.DRIVE_BIBLIOTECA_FOLDER_ID }}
          IG_PAGE_ACCESS_TOKEN: ${{ secrets.IG_PAGE_ACCESS_TOKEN }}
          IG_BUSINESS_ACCOUNT_ID: ${{ secrets.IG_BUSINESS_ACCOUNT_ID }}
          SIRI_DATA_REPO: ${{ secrets.SIRI_DATA_REPO }}
          SIRI_DATA_TOKEN: ${{ secrets.SIRI_DATA_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python main.py
