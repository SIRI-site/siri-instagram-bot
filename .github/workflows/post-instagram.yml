name: Publicar post automático no Instagram

on:
  schedule:
    # Roda a cada 15 minutos, o dia inteiro. A cada execução, o robô
    # confere se algum post de hoje já chegou no horário programado
    # (e ainda não foi publicado) — assim ele publica no horário certo
    # e, se alguma execução falhar por qualquer motivo, a próxima (15
    # min depois) recupera o post pendente sozinha.
    - cron: "*/15 * * * *"
  workflow_dispatch: {}  # permite rodar manualmente pelo GitHub também

permissions:
  contents: write  # necessário para o robô poder commitar as imagens comprimidas

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Rodar o robô de publicação
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          DRIVE_BIBLIOTECA_FOLDER_ID: ${{ secrets.DRIVE_BIBLIOTECA_FOLDER_ID }}
          IG_PAGE_ACCESS_TOKEN: ${{ secrets.IG_PAGE_ACCESS_TOKEN }}
          IG_BUSINESS_ACCOUNT_ID: ${{ secrets.IG_BUSINESS_ACCOUNT_ID }}
          SIRI_DATA_REPO: ${{ secrets.SIRI_DATA_REPO }}
          SIRI_DATA_TOKEN: ${{ secrets.SIRI_DATA_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python main.py
